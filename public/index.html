<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>THS Private Access</title>
  <style>
    :root {
      --black: #070707;
      --panel: rgba(18, 18, 18, 0.94);
      --panel-soft: rgba(255, 255, 255, 0.045);
      --gold: #d9ad45;
      --gold-light: #f2d582;
      --text: #f7f3e8;
      --muted: #aaa59a;
      --danger: #ff5e68;
      --success: #49d892;
      --border: rgba(217, 173, 69, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(217, 173, 69, 0.16), transparent 27rem),
        radial-gradient(circle at 85% 80%, rgba(217, 173, 69, 0.09), transparent 24rem),
        linear-gradient(145deg, #050505 0%, #0e0e0e 52%, #050505 100%);
      padding: 24px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    .shell {
      position: relative;
      width: min(100%, 470px);
    }

    .glow {
      position: absolute;
      inset: 10% 8%;
      z-index: -1;
      border-radius: 50%;
      background: rgba(217, 173, 69, 0.18);
      filter: blur(65px);
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: clamp(28px, 6vw, 48px);
      border: 1px solid var(--border);
      border-radius: 26px;
      background: var(--panel);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(18px);
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(120deg, transparent 30%, rgba(242, 213, 130, 0.05), transparent 70%);
      transform: translateX(-100%);
      animation: sheen 7s ease-in-out infinite;
    }

    @keyframes sheen {
      0%, 68%, 100% { transform: translateX(-100%); }
      82% { transform: translateX(100%); }
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 32px;
    }

    .crest {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(242, 213, 130, 0.62);
      border-radius: 50%;
      color: var(--gold-light);
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(145deg, rgba(217, 173, 69, 0.17), rgba(255, 255, 255, 0.025));
      box-shadow: 0 0 30px rgba(217, 173, 69, 0.12);
    }

    .brand-copy {
      line-height: 1.05;
    }

    .brand-name {
      display: block;
      color: var(--gold-light);
      font-size: 1.08rem;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    .brand-subtitle {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.1rem, 8vw, 3.25rem);
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .intro {
      max-width: 31rem;
      margin: 18px auto 30px;
      color: var(--muted);
      text-align: center;
      font-size: 0.96rem;
      line-height: 1.65;
    }

    .field-label {
      display: block;
      margin-bottom: 9px;
      color: #d6d1c6;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      min-height: 58px;
      padding: 0 58px 0 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      outline: none;
      color: var(--text);
      background: var(--panel-soft);
      font: inherit;
      letter-spacing: 0.04em;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    input::placeholder {
      color: #706d67;
      letter-spacing: normal;
    }

    input:focus {
      border-color: rgba(242, 213, 130, 0.7);
      background: rgba(255, 255, 255, 0.065);
      box-shadow: 0 0 0 4px rgba(217, 173, 69, 0.1);
    }

    .toggle {
      position: absolute;
      top: 50%;
      right: 10px;
      width: 42px;
      height: 42px;
      transform: translateY(-50%);
      border: 0;
      border-radius: 10px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 1rem;
    }

    .toggle:hover,
    .toggle:focus-visible {
      color: var(--gold-light);
      background: rgba(255, 255, 255, 0.06);
      outline: none;
    }

    .submit {
      width: 100%;
      min-height: 58px;
      margin-top: 16px;
      border: 1px solid var(--gold-light);
      border-radius: 14px;
      color: #141006;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      box-shadow: 0 12px 30px rgba(217, 173, 69, 0.17);
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
    }

    .submit:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.04);
      box-shadow: 0 16px 34px rgba(217, 173, 69, 0.22);
    }

    .submit:active:not(:disabled) {
      transform: translateY(0);
    }

    .submit:disabled {
      cursor: not-allowed;
      filter: grayscale(0.7);
      opacity: 0.55;
    }

    .status {
      min-height: 24px;
      margin-top: 16px;
      text-align: center;
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .status.error { color: var(--danger); }
    .status.success { color: var(--success); }
    .status.info { color: var(--gold-light); }

    .attempts {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 7px;
    }

    .attempt-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1px solid rgba(242, 213, 130, 0.45);
      background: rgba(217, 173, 69, 0.18);
    }

    .attempt-dot.used {
      border-color: rgba(255, 94, 104, 0.75);
      background: var(--danger);
      box-shadow: 0 0 9px rgba(255, 94, 104, 0.32);
    }

    .secure-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 28px 0 0;
      color: #817d75;
      font-size: 0.76rem;
      letter-spacing: 0.04em;
    }

    .fine-print {
      margin: 18px 0 0;
      color: #5f5c57;
      text-align: center;
      font-size: 0.68rem;
      line-height: 1.55;
    }

    @media (max-width: 480px) {
      body { padding: 14px; }
      .card { border-radius: 22px; }
      .brand { margin-bottom: 28px; }
      .crest { width: 48px; height: 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="glow" aria-hidden="true"></div>

    <section class="card" aria-labelledby="page-title">
      <div class="brand">
        <div class="crest" aria-hidden="true">THS</div>
        <div class="brand-copy">
          <span class="brand-name">THS</span>
          <span class="brand-subtitle">The House of Smoke</span>
        </div>
      </div>

      <h1 id="page-title">Private Access</h1>
      <p class="intro">
        Enter your private access code to continue to the members channel.
      </p>

      <form id="access-form" novalidate>
        <label class="field-label" for="access-code">Access code</label>
        <div class="input-wrap">
          <input
            id="access-code"
            name="code"
            type="password"
            placeholder="Enter your code"
            autocomplete="current-password"
            autocapitalize="none"
            spellcheck="false"
            maxlength="100"
            required
          >
          <button class="toggle" id="toggle-code" type="button" aria-label="Show access code" title="Show access code">Show</button>
        </div>

        <button class="submit" id="submit-button" type="submit">
          Unlock access
        </button>

        <div class="status" id="status" role="status" aria-live="polite"></div>
        <div class="attempts" id="attempts" aria-label="Access attempts remaining">
          <span class="attempt-dot"></span>
          <span class="attempt-dot"></span>
          <span class="attempt-dot"></span>
        </div>
      </form>

      <p class="secure-note"><span aria-hidden="true">🔒</span> Private members only</p>
      <p class="fine-print">Authorised access only. Never share your access code publicly.</p>
    </section>
  </main>

  <script>
    (() => {
      const MAX_ATTEMPTS = 3;
      const LOCK_DURATION_MS = 15 * 60 * 1000;
      const STORAGE_KEY = 'ths-access-state-v1';

      const form = document.getElementById('access-form');
      const input = document.getElementById('access-code');
      const toggle = document.getElementById('toggle-code');
      const button = document.getElementById('submit-button');
      const status = document.getElementById('status');
      const attemptDots = Array.from(document.querySelectorAll('.attempt-dot'));

      const makeSessionId = () => {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }

        return `ths-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      };

      const defaultState = () => ({
        sessionId: makeSessionId(),
        attempts: 0,
        lockUntil: 0
      });

      const readState = () => {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          return saved && saved.sessionId ? saved : defaultState();
        } catch {
          return defaultState();
        }
      };

      let state = readState();
      let countdownTimer;

      const saveState = () => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      };

      const setStatus = (message = '', type = '') => {
        status.textContent = message;
        status.className = `status${type ? ` ${type}` : ''}`;
      };

      const renderAttempts = () => {
        attemptDots.forEach((dot, index) => {
          dot.classList.toggle('used', index < state.attempts);
        });
      };

      const clearLockIfExpired = () => {
        if (state.lockUntil && Date.now() >= state.lockUntil) {
          state = defaultState();
          saveState();
        }
      };

      const renderLock = () => {
        clearLockIfExpired();
        clearInterval(countdownTimer);

        const remainingMs = state.lockUntil - Date.now();
        const isLocked = remainingMs > 0;

        input.disabled = isLocked;
        button.disabled = isLocked;
        renderAttempts();

        if (!isLocked) {
          return;
        }

        const updateCountdown = () => {
          const ms = state.lockUntil - Date.now();

          if (ms <= 0) {
            clearInterval(countdownTimer);
            state = defaultState();
            saveState();
            input.disabled = false;
            button.disabled = false;
            setStatus('You can try again now.', 'info');
            renderAttempts();
            input.focus();
            return;
          }

          const minutes = Math.floor(ms / 60000);
          const seconds = Math.ceil((ms % 60000) / 1000);
          setStatus(`Access locked. Try again in ${minutes}:${String(seconds).padStart(2, '0')}.`, 'error');
        };

        updateCountdown();
        countdownTimer = setInterval(updateCountdown, 1000);
      };

      toggle.addEventListener('click', () => {
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        toggle.textContent = showing ? 'Show' : 'Hide';
        toggle.setAttribute('aria-label', showing ? 'Show access code' : 'Hide access code');
        toggle.setAttribute('title', showing ? 'Show access code' : 'Hide access code');
        input.focus();
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        clearLockIfExpired();

        if (state.lockUntil > Date.now()) {
          renderLock();
          return;
        }

        const code = input.value.trim();

        if (!code) {
          setStatus('Please enter your access code.', 'error');
          input.focus();
          return;
        }

        button.disabled = true;
        button.textContent = 'Checking…';
        setStatus('Verifying private access…', 'info');

        try {
          const response = await fetch('/api/validate', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              code,
              sessionId: state.sessionId
            })
          });

          const data = await response.json().catch(() => ({}));

          if (response.ok && data.success && data.redirect) {
            localStorage.removeItem(STORAGE_KEY);
            setStatus(data.message || 'Access granted. Redirecting…', 'success');
            button.textContent = 'Access granted';
            input.value = '';

            window.setTimeout(() => {
              window.location.assign(data.redirect);
            }, 700);
            return;
          }

          state.attempts = Math.min(Number(data.attempts ?? state.attempts + 1), MAX_ATTEMPTS);

          if (data.locked || state.attempts >= MAX_ATTEMPTS) {
            state.lockUntil = Date.now() + LOCK_DURATION_MS;
          }

          saveState();
          renderAttempts();
          input.value = '';
          setStatus(data.error || 'Access could not be verified.', 'error');

          if (state.lockUntil) {
            renderLock();
          } else {
            input.focus();
          }
        } catch {
          setStatus('The access service is temporarily unavailable. Please try again shortly.', 'error');
        } finally {
          if (!state.lockUntil) {
            button.disabled = false;
            button.textContent = 'Unlock access';
          }
        }
      });

      saveState();
      renderLock();
    })();
  </script>
</body>
</html>
